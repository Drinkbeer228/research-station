<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Живая библиотека: предпросмотр</title>
<style>
/*FONTS*/
:root{--ink:#2C302E;--stone:#F4F1EA;--stone2:#EAE5DA;--sand:#E8E4DA;--sage:#2E5A44;--terra:#C86D51;--ochre:#A96B3B;--muted:#5A605D;--wood:#9A744C;--woodd:#6E5032;
--paper:#FBF7EC;--paper2:#F3ECDC;--paperink:#2A2925;--ui:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--serif:'Source Serif 4',Georgia,serif;--mono:'BookMono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--sand);color:var(--ink);font-family:var(--ui)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ===== hall ===== */
#hall{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#E8E4DA}
#cv{display:block}
.hud{position:fixed;z-index:5;display:inline-flex;align-items:center;gap:10px;background:rgba(244,241,234,.94);border:1.5px solid var(--ink);border-radius:12px;padding:8px 14px;min-height:44px;font-weight:700;font-size:13px;letter-spacing:.06em;box-shadow:0 4px 16px rgba(44,48,46,.1)}
.hud.tl{left:14px;top:12px}.hud.tr{right:14px;top:12px;cursor:pointer}
.hud.b{left:50%;bottom:12px;transform:translateX(-50%);font-weight:500;letter-spacing:0;font-size:12.5px;white-space:nowrap;min-height:36px;padding:6px 14px;border-radius:10px}
#tip{position:fixed;z-index:6;pointer-events:none;background:var(--stone);border:1.5px solid var(--ink);border-radius:9px;padding:6px 10px;max-width:280px;font-size:12.5px;font-weight:600;box-shadow:0 6px 18px rgba(44,48,46,.18);transform:translate(-50%,calc(-100% - 12px));opacity:0;transition:opacity .12s}
#tip small{display:block;font-weight:500;color:var(--muted);font-size:11px;margin-top:2px}

/* ===== shelf ===== */
#shelf{position:fixed;inset:0;z-index:20;background:rgba(44,48,46,.5);display:none;align-items:center;justify-content:center;padding:16px}
#shelf.open{display:flex}
.sh-card{width:min(1120px,100%);max-height:100%;overflow:auto;background:var(--stone);border:2px solid var(--ink);border-radius:18px;box-shadow:0 24px 48px rgba(44,48,46,.28);padding:22px}
.sh-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.sh-k{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--terra)}
.sh-t{font-size:24px;font-weight:700;letter-spacing:-.01em}
.x{width:40px;height:40px;border:1.5px solid var(--ink);border-radius:10px;background:var(--sand);font-size:18px;flex:none}
.sh-body{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:18px;align-items:stretch}
.case{background:linear-gradient(#5c422a,#6E5032);border:2px solid var(--ink);border-radius:10px;padding:14px 12px 0;min-height:372px;display:flex;align-items:flex-end;overflow-x:auto;position:relative}
.case::after{content:"";position:sticky;right:0}
.row{display:flex;align-items:flex-end;gap:2px;width:100%;min-width:max-content;border-bottom:12px solid #8c6a45;box-shadow:0 2px 0 var(--ink);padding:0 6px}
.spine{position:relative;width:var(--w);height:var(--h);background:var(--c);border:1.6px solid var(--ink);border-radius:4px 4px 2px 2px;color:#FBF3E2;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:9px 0 8px;flex:none;transition:transform .18s cubic-bezier(.16,1,.3,1);box-shadow:inset 3px 0 0 rgba(255,255,255,.12),inset -4px 0 0 rgba(0,0,0,.12)}
.spine:hover{transform:translateY(-8px)}
.spine.sel{transform:translateY(-20px)}
.spine:focus-visible{outline:2px solid #F7D388;outline-offset:2px}
.sp-b{width:calc(100% - 6px);height:7px;border-top:1.5px solid rgba(255,235,190,.75);border-bottom:1.5px solid rgba(255,235,190,.75);flex:none}
.sp-t{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--serif);font-weight:600;font-size:15px;line-height:1.1;flex:1;display:flex;align-items:center;justify-content:center;padding:8px 0;white-space:nowrap}
.sp-m{font-size:8.5px;font-weight:700;letter-spacing:.04em;opacity:.8;flex:none}
.sp-r{position:absolute;right:6px;top:-1px;width:8px;height:30px;background:var(--terra);clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%);box-shadow:0 0 0 1px var(--ink)}
.bookend{width:30px;height:70px;background:#2C302E;border-radius:3px 3px 0 0;flex:none;margin-left:6px;opacity:.85}
.detail{background:#fff;border:1.5px solid var(--ink);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px;min-height:372px}
.d-m{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--terra);text-transform:uppercase}
.d-t{font-family:var(--serif);font-weight:600;font-size:21px;line-height:1.2}
.d-f{font-size:13.5px;line-height:1.45;color:var(--ink)}
.d-d{font-size:13.5px;line-height:1.5;color:var(--muted);flex:1}
.d-c{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11.5px;font-weight:600;border:1.2px solid var(--ink);border-radius:999px;padding:3px 9px;background:var(--stone)}
.btn{height:46px;border:1.5px solid var(--ink);border-radius:12px;background:var(--sage);color:#fff;font-weight:600;font-size:14px;padding:0 18px}
.btn.ghost{background:var(--sand);color:var(--ink)}
.d-a{display:flex;gap:8px;flex-wrap:wrap}.d-a .btn:first-child{flex:1}

/* ===== reader ===== */
#reader{position:fixed;inset:0;z-index:30;display:none;overflow:hidden;background:#59402A}
#reader.open{display:block}
.desk{position:absolute;inset:0;background:
 radial-gradient(ellipse 58% 74% at 6% 20%,rgba(255,216,150,.44),rgba(255,216,150,0) 72%),
 repeating-linear-gradient(90deg,rgba(0,0,0,0) 0 118px,rgba(30,18,8,.16) 118px 120px),
 linear-gradient(#6E5032,#5A4129)}
#reader.night .desk{background:
 radial-gradient(ellipse 52% 66% at 6% 20%,rgba(255,196,120,.36),rgba(255,196,120,0) 74%),
 repeating-linear-gradient(90deg,rgba(0,0,0,0) 0 118px,rgba(0,0,0,.24) 118px 120px),
 linear-gradient(#2c2219,#1f1812)}
.lamp{position:absolute;left:-44px;top:96px;width:150px;height:150px;pointer-events:none}
.pile{position:absolute;right:10px;bottom:26px;width:128px;height:112px;pointer-events:auto;cursor:pointer}
.catbody{transform-origin:62px 58px;animation:br 4.6s ease-in-out infinite}
@keyframes br{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.bar{position:absolute;left:0;right:0;top:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;z-index:9;pointer-events:none}
.bar>div{display:flex;gap:6px;pointer-events:auto}
.rb{height:38px;min-width:38px;padding:0 12px;border:1.5px solid var(--ink);border-radius:10px;background:rgba(244,241,234,.92);font-size:13px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.rb[aria-pressed=true]{background:var(--sage);color:#fff}
.bookwrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-top:30px;perspective:2600px}
.book{position:relative;width:calc(var(--W)*2);height:var(--H);transition:transform .75s cubic-bezier(.3,.1,.25,1)}
.book.single{width:var(--W)}
.book.closed{transform:translateX(calc(var(--W)*-.5))}
.stack{position:absolute;top:3px;bottom:3px;background:repeating-linear-gradient(90deg,#EFE7D3 0 1px,#D9CEB5 1px 2px);border:1.6px solid var(--ink)}
.stack.l{right:calc(100% - 1px);width:var(--sl);border-radius:4px 0 0 4px;border-right:0}
.stack.r{left:calc(100% - 1px);width:var(--sr);border-radius:0 4px 4px 0;border-left:0}
.book.closed .stack.l,.book.closed .pg.L,.book.closed .gut{visibility:hidden}
.pg{position:absolute;top:0;width:var(--W);height:var(--H);background:var(--paper);overflow:hidden;border:1.6px solid var(--ink)}
.pg.L{left:0;border-radius:6px 0 0 6px;border-right:0}
.pg.R{left:var(--W);border-radius:0 6px 6px 0;border-left:0}
.book.single .pg.R{left:0;border-radius:6px;border-left:1.6px solid var(--ink)}
.pg::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:2}
.pg.sl::before{background:linear-gradient(270deg,rgba(84,62,34,.20),rgba(84,62,34,.06) 22px,rgba(84,62,34,0) 64px)}
.pg.sr::before{background:linear-gradient(90deg,rgba(84,62,34,.20),rgba(84,62,34,.06) 22px,rgba(84,62,34,0) 64px)}
.ph{position:absolute;top:24px;left:0;right:0;font:600 11.5px/1 var(--serif);letter-spacing:.03em;color:#7d7566;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf{position:absolute;bottom:22px;font:500 12.5px/1 var(--serif);color:#6d6658;font-variant-numeric:oldstyle-nums}
.sl .ph{padding:0 var(--pi) 0 var(--po);text-align:left}
.sr .ph{padding:0 var(--po) 0 var(--pi);text-align:right}
.sl .pf{left:var(--po)}.sr .pf{right:var(--po)}
.win{position:absolute;top:var(--pt);width:var(--cw);height:var(--ch);overflow:hidden}
.sl .win{left:var(--po)}.sr .win{left:var(--pi)}
.blankpg .win,.blankpg .ph,.blankpg .pf{visibility:hidden}
.endp{position:absolute;inset:0;display:none;background:repeating-linear-gradient(135deg,#2E5A44 0 6px,#285039 6px 12px)}
.blankpg .endp{display:block}
.gut{position:absolute;left:calc(var(--W) - 1px);top:0;bottom:0;width:2px;background:rgba(44,48,46,.55);z-index:3}
.book.single .gut{display:none}
.leaf{position:absolute;top:0;width:var(--W);height:var(--H);transform-style:preserve-3d;z-index:6}
.leaf.fwd{left:var(--W);transform-origin:left center}
.leaf.bwd{left:0;transform-origin:right center}
.book.single .leaf.fwd{left:0;transform-origin:left center}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face .pg{left:0;top:0;border-radius:0}
.face.b{transform:rotateY(180deg)}
.shade{position:absolute;inset:0;z-index:4;pointer-events:none;background:linear-gradient(90deg,rgba(60,44,24,.5),rgba(60,44,24,.1));opacity:0}
.cover{position:absolute;left:var(--W);top:0;width:var(--W);height:var(--H);transform-origin:left center;transform-style:preserve-3d;z-index:8}
.book.single .cover{left:0}
.c-f,.c-b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:2px solid var(--ink);border-radius:3px 8px 8px 3px}
.c-f{background:var(--cc);color:#FBF0D9;padding:9% 9%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;box-shadow:inset 16px 0 0 rgba(0,0,0,.14)}
.c-f .fr{position:absolute;inset:18px 18px 18px 30px;border:1.5px solid rgba(255,232,186,.65);border-radius:4px}
.c-f h3{font:600 clamp(26px,3.4vw,44px)/1.12 var(--serif)}
.c-f p{font:700 11.5px/1 var(--ui);letter-spacing:.2em;text-transform:uppercase;opacity:.86}
.c-b{transform:rotateY(180deg);background:repeating-linear-gradient(135deg,#2E5A44 0 6px,#285039 6px 12px);border-radius:8px 3px 3px 8px}
.edge{position:absolute;top:0;bottom:0;width:13%;z-index:5;cursor:pointer}
.edge.p{left:0}.edge.n{right:0}
.prog{position:absolute;left:50%;bottom:9px;transform:translateX(-50%);color:rgba(255,240,214,.82);font-size:12px;font-weight:600;letter-spacing:.03em;z-index:4}

/* flowed text */
.flow{position:relative;width:var(--cw);height:var(--ch);column-width:var(--cw);column-gap:var(--gap);column-fill:auto;font-family:var(--serif);font-size:var(--fs);line-height:var(--lh);color:var(--paperink);text-align:justify;overflow-wrap:anywhere;hyphens:manual;-webkit-hyphens:manual;orphans:2;widows:2;font-optical-sizing:auto;user-select:text;-webkit-user-select:text;font-feature-settings:"onum" 0}
#reader.night .pg{--paper:#25211b;background:#25211b}#reader.night .flow{color:#d9d0bd}
#reader.night .ph,#reader.night .pf{color:#8e8571}
.flow p{margin:0;text-indent:1.25em}
.flow h2+p,.flow h3+p,.flow ul+p,.flow ol+p,.flow .plate+p,.flow blockquote+p,.flow .nf,.flow p.nf{text-indent:0}
.flow .body>p:first-of-type{text-indent:0}
.flow .body>p:first-of-type::first-letter{font-size:3.1em;line-height:.82;float:left;padding:.07em .08em 0 0;font-weight:600;color:var(--sage)}
.flow h2{font-size:1.26em;line-height:1.24;font-weight:650;text-align:left;hyphens:manual;margin:calc(var(--lh)*1.1) 0 calc(var(--lh)*.42);break-after:avoid;color:var(--sage)}
#reader.night .flow h2{color:#9cc4ae}
.flow h3{font-size:1.04em;line-height:1.3;font-weight:650;font-style:italic;text-align:left;hyphens:manual;margin:calc(var(--lh)*.7) 0 calc(var(--lh)*.2);break-after:avoid}
.flow hr{display:none}
.flow ul,.flow ol{margin:calc(var(--lh)*.3) 0 calc(var(--lh)*.3) 1.25em}
.flow li{margin:0 0 .16em;padding-left:.1em}.flow li p{text-indent:0}
.flow blockquote{margin:calc(var(--lh)*.4) 0;padding:.1em 0 .1em .9em;border-left:2.5px solid var(--terra);font-size:.92em;line-height:1.42}
.flow blockquote p{text-indent:0}
.flow em{font-style:italic}.flow strong{font-weight:650}
.flow sup{line-height:0;font-size:.64em;vertical-align:super;font-weight:600;font-family:var(--ui)}
.flow sup+sup::before{content:",";color:#9a8f7a}
.flow sup a{color:var(--terra);text-decoration:none;padding:0 .05em}
.flow a{color:var(--sage);text-decoration-thickness:1px;text-underline-offset:2px}
.flow math{font-size:1.02em}.flow .katex-mathml{}
.flow .katex-display,.flow math[display=block]{display:block;text-align:center;margin:calc(var(--lh)*.4) 0;break-inside:avoid}
.flow table{width:100%;border-collapse:collapse;font-size:.76em;line-height:1.3;margin:calc(var(--lh)*.5) 0;text-align:left;hyphens:auto;font-family:var(--serif)}
.flow th{border-bottom:1.6px solid var(--paperink);padding:.26em .4em .26em 0;font-weight:650;vertical-align:bottom}
.flow td{border-bottom:.8px solid rgba(70,60,40,.3);padding:.26em .4em .26em 0;vertical-align:top}
.flow img{display:block;max-width:100%;max-height:calc(var(--ch)*.6);width:auto;height:auto;margin:0 auto .5em;border:1px solid rgba(44,48,46,.4);border-radius:2px}
.flow p.fig{text-indent:0;font-size:.78em;line-height:1.34;text-align:left;hyphens:manual;margin:calc(var(--lh)*.4) 0;break-inside:avoid;cursor:zoom-in}
.plate{position:relative;margin:calc(var(--lh)*.45) 0;break-inside:avoid;cursor:default}
.plate pre{font-family:var(--mono);white-space:pre;overflow:hidden;text-align:left;hyphens:none;background:rgba(120,100,60,.07);border:1px solid rgba(70,60,40,.22);border-radius:3px;padding:.6em .3em;font-variant-ligatures:none}
.plate.prose pre{white-space:pre-wrap;font-size:.76em;line-height:1.35}
.plate.fold{cursor:zoom-in}
.plate.fold pre{max-height:calc(var(--ch)*.46)}
.unf{display:none;position:absolute;right:6px;bottom:6px;font:600 11px/1 var(--ui);background:var(--stone);border:1.3px solid var(--ink);border-radius:7px;padding:6px 8px;color:var(--ink)}
.plate.fold .unf{display:block}
.fm{height:var(--ch);break-after:column;text-align:left;hyphens:manual}
.fm.title{display:flex;flex-direction:column;justify-content:space-between;text-align:center}
.t-k{font:700 10.5px/1.5 var(--ui);letter-spacing:.2em;text-transform:uppercase;color:var(--terra)}
.fm.title h1{font-weight:600;font-size:calc(var(--fs)*1.46);line-height:1.2;color:var(--paperink)}
.t-d{font-size:.84em;line-height:1.42;color:#6b6456;font-style:italic;margin-top:1.1em}
.t-f{font:600 12.5px/1.6 var(--serif);color:#6b6456}
.t-f b{display:block;font-size:14px;color:var(--paperink)}
.fm.verso{display:flex;flex-direction:column;justify-content:flex-end;font-size:.82em;line-height:1.42}
.fm.verso dl{display:grid;grid-template-columns:auto 1fr;gap:.25em 1em}
.fm.verso dt{color:#7d7566}.fm.verso dd{font-weight:600}
.fm.contents h2{margin-top:0;font-size:1.4em}
.c-r{display:flex;align-items:baseline;gap:.4em;font-size:.88em;line-height:1.3;padding:.26em 0;text-align:left;width:100%;color:inherit;cursor:pointer;font-family:var(--serif)}
.c-r span:first-child{flex:0 1 auto}
.c-r i{flex:1;border-bottom:1.2px dotted #a79b83;transform:translateY(-.25em);min-width:14px}
.c-r b{font-weight:600;font-variant-numeric:lining-nums}
.c-r:hover{color:var(--terra)}
.fm.blank{height:var(--ch)}
.refs-title{break-before:column;margin-top:0!important}
.footnotes ol{margin-left:1.5em;font-size:.76em;line-height:1.34;text-align:left;hyphens:manual}
.footnotes li{margin-bottom:.34em}.footnotes li p{display:inline}
.fm.end{height:auto;break-before:column;break-after:auto;font-size:.9em;line-height:1.42}
.e-h{font:700 10.5px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--terra);margin:1.1em 0 .5em}
.e-c{display:block;border:1.3px solid rgba(44,48,46,.55);border-radius:8px;padding:.5em .7em;margin:.4em 0;background:rgba(255,255,255,.4);text-decoration:none;color:inherit;line-height:1.3}
.e-c small{display:block;font:600 10.5px/1.5 var(--ui);color:#7d7566;letter-spacing:.03em}
.slip{margin-top:1em;border:1.3px solid rgba(44,48,46,.55);border-radius:3px;font:500 11px/1 var(--ui)}
.slip div{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid rgba(44,48,46,.3)}
.slip div:first-child{border-top:0;background:rgba(120,100,60,.1);font-weight:700;letter-spacing:.05em}
.slip span{padding:.6em .7em;border-left:1px solid rgba(44,48,46,.3);min-height:2.4em}.slip span:first-child{border-left:0}
.stamp{display:inline-block;color:#a44c35;border:1.6px solid #a44c35;border-radius:3px;padding:.15em .4em;font-weight:700;letter-spacing:.06em;transform:rotate(-3deg);font-size:10.5px}
#probe{position:absolute;left:-99999px;top:0;width:var(--cw);height:var(--ch);overflow:hidden}
#note{position:absolute;z-index:12;max-width:min(360px,calc(100vw - 24px));background:var(--stone);border:1.8px solid var(--ink);border-radius:11px;box-shadow:0 12px 30px rgba(0,0,0,.34);padding:11px 13px;font:400 14px/1.42 var(--serif);color:var(--ink);display:none}
#note b{display:block;font:700 10.5px/1.4 var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--terra);margin-bottom:3px}
#fold{position:absolute;inset:0;z-index:14;display:none;align-items:center;justify-content:center;padding:62px 14px 14px;background:rgba(30,20,10,.46)}
#fold.open{display:flex}
.sheet{position:relative;max-width:100%;max-height:100%;overflow:auto;background:var(--paper);border:2px solid var(--ink);border-radius:4px;box-shadow:0 20px 50px rgba(0,0,0,.45);padding:26px 24px 20px;transform-origin:left center;animation:unfold .5s cubic-bezier(.2,.8,.2,1)}
@keyframes unfold{from{transform:perspective(1400px) rotateY(-70deg) scaleX(.5);opacity:.2}to{transform:none;opacity:1}}
.sheet::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,transparent 0 calc(33.33% - 1px),rgba(90,70,40,.12) calc(33.33% - 1px) 33.33%)}
.sheet pre{font:13.5px/1.34 var(--mono);white-space:pre;color:var(--paperink);font-variant-ligatures:none}
.sheet .tbl{font:14px/1.4 var(--serif);color:var(--paperink)}
.sheet .tbl table{border-collapse:collapse}.sheet .tbl th,.sheet .tbl td{border-bottom:1px solid rgba(70,60,40,.35);padding:.35em .9em .35em 0;text-align:left;vertical-align:top}
.sheet img{display:block;max-width:100%;max-height:78vh}
.sheet .cl{position:sticky;left:100%;top:0;float:right;margin:-14px -10px 0 8px;z-index:2}

@media (max-width:860px){
 .sh-body{grid-template-columns:1fr}.detail{min-height:0}.case{min-height:340px}
 .hud.b{font-size:11px;white-space:normal;width:calc(100% - 24px);text-align:center;justify-content:center}
 .pile,.lamp{display:none}.hud.tl{font-size:11px}
}
@media (prefers-reduced-motion:reduce){.catbody{animation:none}.sheet{animation:none}.book{transition:none}}
</style>
</head>
<body>
<div id="hall"><canvas id="cv" aria-label="План читального зала"></canvas></div>
